[package]
name = "dsh-desktop"
version = "0.1.0-rc.5"
description = "DeepSeek Harness desktop shell: runs the local dsh web runtime and hosts the native bridge"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Windows-only shell-identity registration (Start Menu shortcut + AUMID);
# the features cover the COM shortcut/property-store surface aumid.rs uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-deep-link = "2.4.9"
base64 = "0.23.1"

[profile.release]
strip = true
lto = true
